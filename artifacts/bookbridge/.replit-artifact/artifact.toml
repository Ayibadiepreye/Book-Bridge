kind = "web"
previewPath = "/"
title = "BookBridge"
version = "1.0.0"
id = "artifacts/bookbridge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19905

[services.development]
run = "pnpm --filter @workspace/bookbridge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bookbridge", "run", "build" ]
publicDir = "artifacts/bookbridge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19905"
BASE_PATH = "/"
